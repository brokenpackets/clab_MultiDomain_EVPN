name: cEOS_vpnv4_iBGP_PE-CE

topology:
  nodes:
    FW:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/FW.conf
    PE2:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/PE2.conf
    PE1:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/PE1.conf
    HOST4:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/HOST4.conf
    HOST5:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/HOST5.conf
    RR:
      kind: arista_ceos
      image: ceos:4.31.3.1M
      startup-config: ./configs/RR.conf
  links:
    - endpoints: ["PE1:eth3", "FW:eth3"]
    - endpoints: ["PE2:eth2", "FW:eth1"]
    - endpoints: ["PE1:eth1", "RR:eth1"]
    - endpoints: ["PE2:eth1", "RR:eth2"]
    - endpoints: ["PE1:eth2", "HOST5:eth1"]
    - endpoints: ["FW:eth2", "HOST4:eth1"]