no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname PE2
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance OVERLAY1
!
vrf instance OVERLAY2
!
interface Port-Channel7.100
   encapsulation dot1q vlan 100
   vrf OVERLAY1
   ip address 10.10.7.0/31
!
interface Port-Channel7.101
   encapsulation dot1q vlan 101
   vrf OVERLAY2
   ip address 10.10.7.0/31
!
interface Ethernet1
   no switchport
   vrf OVERLAY1
   ip address 10.10.1.1/31
!
interface Ethernet2
   no switchport
   ip address 10.10.1.11/31
   isis enable 1
   isis circuit-type level-2
   isis metric 100
   isis hello padding
   isis network point-to-point
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Loopback0
   ip address 10.255.255.1/32
   node-segment ipv4 index 1
   isis enable 1
   isis passive
!
interface Loopback1
   ip address 10.255.255.127/32
!
interface Management0
   ip address 172.20.20.19/24
   ipv6 address 2001:172:20:20::13/64
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address 00:00:01:0b:fe:03
   vxlan udp-port 4789
   vxlan vrf OVERLAY1 vni 15000
   vxlan vrf OVERLAY2 vni 15001
!
ip routing
ip routing vrf OVERLAY1
ip routing vrf OVERLAY2
!
mpls ip
!
router bgp 65100
   maximum-paths 2 ecmp 2
   neighbor OVERLAY_MPLS peer group
   neighbor OVERLAY_MPLS remote-as 65100
   neighbor OVERLAY_MPLS next-hop-self
   neighbor OVERLAY_MPLS update-source Loopback0
   neighbor OVERLAY_MPLS send-community
   neighbor OVERLAY_VXLAN peer group
   neighbor OVERLAY_VXLAN update-source Loopback0
   neighbor OVERLAY_VXLAN ebgp-multihop
   neighbor OVERLAY_VXLAN send-community
   neighbor UNDERLAY peer group
   neighbor UNDERLAY send-community standard
   neighbor 10.10.1.0 peer group UNDERLAY
   neighbor 10.10.1.0 remote-as 65101
   neighbor 10.10.1.2 peer group UNDERLAY
   neighbor 10.10.1.2 remote-as 65101
   neighbor 10.10.1.4 peer group UNDERLAY
   neighbor 10.10.1.4 remote-as 65102
   neighbor 10.10.1.6 peer group UNDERLAY
   neighbor 10.10.1.6 remote-as 65102
   neighbor 10.10.1.8 peer group UNDERLAY
   neighbor 10.10.1.8 remote-as 65103
   neighbor 10.255.255.3 peer group OVERLAY_VXLAN
   neighbor 10.255.255.3 remote-as 65101
   neighbor 10.255.255.4 peer group OVERLAY_VXLAN
   neighbor 10.255.255.4 remote-as 65101
   neighbor 10.255.255.5 peer group OVERLAY_VXLAN
   neighbor 10.255.255.5 remote-as 65102
   neighbor 10.255.255.6 peer group OVERLAY_VXLAN
   neighbor 10.255.255.6 remote-as 65102
   neighbor 10.255.255.7 peer group OVERLAY_VXLAN
   neighbor 10.255.255.7 remote-as 65103
   neighbor 10.255.255.8 peer group OVERLAY_MPLS
   !
   address-family ipv4
      no neighbor OVERLAY_MPLS activate
      no neighbor OVERLAY_VXLAN activate
      network 10.255.255.1/32
      network 10.255.255.127/32
   !
   address-family vpn-ipv4
      neighbor OVERLAY_MPLS activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
      vpn client ibgp attribute tunneling
   !
   vrf OVERLAY1
      rd 10.255.255.1:15000
      route-target import vpn-ipv4 15000:15000
      route-target export vpn-ipv4 15000:15000
      neighbor 10.10.1.0 remote-as 65100
      neighbor 10.10.1.0 route-reflector-client
      redistribute connected
      !
      address-family ipv4
         neighbor 10.10.1.0 activate
   !
   vrf OVERLAY2
      rd 10.255.255.1:15001
      route-target import evpn 15001:15001
      route-target export evpn 15001:15001
      redistribute connected
!
router general
   router-id ipv4 10.255.255.1
!
router isis 1
   net 49.1111.0010.0255.0001.00
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
      maximum-paths 4
      fast-reroute ti-lfa mode node-protection
   !
   segment-routing mpls
      no shutdown
!
end