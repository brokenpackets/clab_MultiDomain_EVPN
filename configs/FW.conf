no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname FW
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 101
!
interface Ethernet1
   no switchport
   ip address 10.10.1.0/31
!
interface Ethernet2
   no switchport
   ip address 10.20.1.0/31
!
interface Loopback0
   ip address 10.255.255.7/32
!
interface Loopback192
   ip address 192.0.2.1/32
!
interface Management0
   ip address 172.20.20.20/24
   ipv6 address 2001:172:20:20::14/64
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
!
ip prefix-list test123 seq 10 permit 192.0.2.1/32
!
ip route 192.0.2.2/32 10.10.1.1
!
route-map SET_LP permit 5
   match ip address prefix-list test123
!
route-map SET_LP permit 10
   set as-path prepend inbound 65501
   set community 65100:1234
   set local-preference 1200
!
router bgp 65100
   neighbor 10.10.1.1 remote-as 65101
   neighbor 10.10.1.1 send-community standard
   network 192.0.2.2/32
   redistribute connected route-map SET_LP
!
router general
   router-id ipv4 10.255.255.7
!
end